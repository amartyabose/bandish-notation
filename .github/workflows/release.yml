name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Build plugin
              run: |
                  npm ci
                  npm run build

            - name: Check for optional styles
              id: styles
              run: |
                  if [ -f styles.css ]; then
                    echo "has_styles=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "has_styles=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      ${{ steps.styles.outputs.has_styles == 'true' && 'styles.css' || '' }}

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  
                  if [ "${{ steps.styles.outputs.has_styles }}" = "true" ]; then
                    gh release create "$tag" --title="$tag" main.js manifest.json styles.css
                  else
                    gh release create "$tag" --title="$tag" main.js manifest.json
                  fi

