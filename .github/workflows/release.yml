name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Build plugin
              run: |
                  npm ci
                  npm run build

            - name: Check for optional styles
              id: styles
              run: |
                  if [ -f styles.css ]; then
                    echo "exists=true" >> "$GITHUB_OUTPUT"
                    echo "files=main.js manifest.json styles.css" >> "$GITHUB_OUTPUT"
                    echo "attest_files=main.js"$'\n'"styles.css" >> "$GITHUB_OUTPUT"
                  else
                    echo "exists=false" >> "$GITHUB_OUTPUT"
                    echo "files=main.js manifest.json" >> "$GITHUB_OUTPUT"
                    echo "attest_files=main.js" >> "$GITHUB_OUTPUT"
                  fi

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: ${{ steps.styles.outputs.attest_files }}

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  
                  # Removed --draft so BRAT can actually read the release assets on your iPad
                  gh release create "$tag" \
                    --title="$tag" \
                    ${{ steps.styles.outputs.files }}

